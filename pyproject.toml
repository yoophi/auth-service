[project]
name = "auth_service"
version = "0.1.0"
description = "Python Boilerplate contains all the boilerplate you need to create a Python package."
readme = "README.rst"
license = "MIT"
authors = [
    { name = "Pyunghyuk Yoo", email = "yoophi@gmail.com" }
]
keywords = ["auth_service"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Click>=8.0",
    "Flask>=2.3,<3.0",
    "authlib>=1.0,<2.0",
    "email-validator>=2.0",
    "Flask-Migrate>=4.0",
    "Flask-Cors>=4.0,<5.0",
    "Flask-Login>=0.6",
    "Flask-Marshmallow>=1.0",
    "Flask-SQLAlchemy>=3.0,<3.2",
    "Flask-Swagger>=0.2.14",
    "google-api-core>=2.0,<3.0",
    "requests>=2.28",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "bump2version>=1.0.1",
    "wheel>=0.45.0",
    "watchdog>=6.0.0",
    "flake8>=7.0.0",
    "tox>=4.0.0",
    "tox-uv>=1.0.0",
    "coverage>=7.0.0",
    "Sphinx>=7.0.0",
    "twine>=6.0.0",
    "pytest>=8.0.0",
    "pytest-runner>=6.0.0",
]
prod = [
    "gunicorn>=23.0.0",
]

[project.scripts]
auth_service = "auth_service.cli:main"

[project.urls]
Homepage = "https://github.com/yoophi/auth_service"
Repository = "https://github.com/yoophi/auth_service"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["auth_service"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
